<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Atlas AI</title>
    <meta name="description" content="Atlas AI — a fast, private chat assistant powered by open-source language models running on your own machine." />
    <link rel="canonical" href="https://atlas.omarhosny.work.gd/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atlas AI" />
    <meta property="og:title" content="Atlas AI" />
    <meta property="og:description" content="Atlas AI — a fast, private chat assistant powered by open-source language models running on your own machine." />
    <meta property="og:url" content="https://atlas.omarhosny.work.gd/" />
    <meta name="twitter:card" content="summary" />
    <meta name="author" content="Omar Hosny" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#050a13" />
    <meta name="color-scheme" content="dark" />
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas AI" />

    <!-- Fonts: progressive enhancement only — the fallback stack in
         public/tokens.css keeps the app fully usable offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Design tokens: single source of truth, shared with offline.html and 404.html -->
    <link rel="stylesheet" href="/tokens.css" />

    <!-- Prevents a flash of the wrong theme before React mounts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('atlas-ai-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : 'dark';
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WGRWT22GMS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-WGRWT22GMS');
    </script>
  <!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B4EH1NHSSQ"></script>

</head>
