<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050a13" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/site.css" />
    <title>Atlas AI — Offline</title>
  </head>
  <body>
    <main class="wrap">
      <div class="orbit" aria-hidden="true"><span class="ring"><i></i></span><svg viewBox="0 0 64 64" role="img" aria-label="Atlas AI"><path d="M9.18 47.42 A24 8 -18 0 1 54.82 32.58" fill="none" stroke="#67e8f9" stroke-width="2.6" stroke-opacity=".38"/><path d="M9 54 L28.2 9 H35.8 L55 54 H46.4 L32 20.4 L17.6 54 Z" fill="currentColor"/><path d="M9.18 47.42 A24 8 -18 0 0 54.82 32.58" fill="none" stroke="#67e8f9" stroke-width="2.6" stroke-linecap="round"/><circle cx="54.82" cy="32.58" r="3.6" fill="#67e8f9"/></svg></div>
      <h1>You're offline</h1>
      <p>Atlas AI can't reach the network right now. Reconnect and try again — your previous conversations will still be here.</p>
      <div class="row">
        <button class="btn" type="button" onclick="location.reload()">Retry</button>
        <a class="btn ghost" href="/">Back to Atlas AI</a>
      </div>
      <p class="help">Support &amp; updates: <a href="mailto:atlas@omarhosny.work.gd">atlas@omarhosny.work.gd</a></p>
    </main>
    <div class="wordmark" aria-hidden="true">Atlas</div>
    <script>
      // Reload automatically as soon as the connection returns.
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
