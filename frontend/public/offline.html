<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas AI — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1116;
        color: #e6e8eb;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 22px;
        margin-bottom: 8px;
      }
      p {
        color: #8b93a0;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      button {
        background: #1f8a70;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Atlas AI can't reach the network right now. Reconnect and try again — your previous conversations will still be here.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
